name: iOS Build

on:
  push:
    paths:
      - "SpaceQuest/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set +e
          xcodebuild \
            -project SpaceQuest/SpaceQuest.xcodeproj \
            -scheme SpaceQuest \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          STATUS=$?
          echo "===== errors / warnings ====="
          grep -E "(error|warning):" build.log | grep -v "^ld: warning" | sort -u | head -150
          echo "===== last lines ====="
          tail -5 build.log
          exit $STATUS

      - name: Run in Simulator and take screenshots
        run: |
          set -u
          APP=build/Build/Products/Debug-iphonesimulator/SpaceQuest.app
          BUNDLE=com.hanwc1.SpaceQuest
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]( Pro)? \(" | head -1 | grep -oE "[0-9A-F]{8}-[0-9A-F-]{27}")
          if [ -z "$UDID" ]; then UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F]{8}-[0-9A-F-]{27}"); fi
          echo "Simulator: $(xcrun simctl list devices | grep "$UDID")"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          FAILED=0
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" "$BUNDLE" -demo "$@"
            sleep 6
            if xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE"; then
              echo "RUNNING: $name"
            else
              echo "CRASHED: $name"
              FAILED=1
            fi
            xcrun simctl io "$UDID" screenshot "shots/$name.png" >/dev/null 2>&1
            sips -Z 900 "shots/$name.png" >/dev/null
          }
          shoot 1-home -tab home
          shoot 2-dex -tab dex
          shoot 3-log -tab log
          shoot 4-settings -tab settings
          shoot 5-planet -tab home -celebrate planet
          shoot 6-capsule -tab home -celebrate capsule
          shoot 7-levelup -tab home -celebrate level
          echo "===== crash reports ====="
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i spacequest || echo "none"
          ls -la shots
          exit $FAILED

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 7

  # 스크린샷을 별도 브랜치(ci-screenshots)에 올려서 쉽게 볼 수 있게 해요.
  # 쓰기 권한은 이 작업에만 있고, 빌드 작업은 읽기 전용이에요.
  publish-screenshots:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: shots
      - name: Push to ci-screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
